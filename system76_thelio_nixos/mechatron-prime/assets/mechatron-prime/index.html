<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090909">
    <title>Mechatron Prime</title>
    <style>
      :root { background: #090909; }
      body {
        align-items: center;
        background: #090909;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main { width: min(100%, 96rem); }
      img {
        display: block;
        height: auto;
        max-width: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <img id="mechatron-prime-art" src="mecha-T2-B.jxl" alt="Mechatron Prime, the build and CI bot for Mecha LLC, created and maintained by Peter Marreck and an army of chaotic-good AI agents">
    </main>
    <script>
      const images = [
        "mecha-T2-B.jxl",
        "mecha-T2.jxl",
        "mecha-bjork-all-is-full-of-mecha.jxl",
        "mecha-d-in-a-box.jxl",
        "mecha-knight-rider.jxl",
        "mecha-starfighter.jxl",
        "mecha-wopr.jxl",
      ];
      const image = document.getElementById("mechatron-prime-art");
      image.src = images[Math.floor(Math.random() * images.length)];
    </script>
  </body>
</html>
